name: Github Actions Demo

on:
  push:
    branches: [ "**" ] # Trigger on every push to any branch
  pull_request:
    branches: [ "main" ]

# Global Environment Variables
env:
  DOCKER_IMAGE_NAME: "demo-app"
  IMAGE_TAG: "v${{ github.run_number }}"

jobs:
  # STEP 1: CONTINUOUS INTEGRATION (Build Validation)
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3    # Pull code from the repo
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Dependencies
        run: pip install -r requirements.txt   # Verify environment can be built

  # STEP 2: CONTINUOUS INTEGRATION (Testing and Artifacts)
  test:
    needs: build    # Wait for build to pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Tests & Generate Artifact
        run: |
          pip install -r requirements.txt
          # Run pytest and generate an HTML report (The Artifact)
          pytest --cov=app --cov-report=html test-app.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report       # Name of the zip file in GitHub UI
          path: htmlcov/              # Folder to be packaged

  # STEP 3: CONTINUOUS DELIVERY (Pushing to Docker Hub)
  release:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push to Registry
        run: |
          echo "📦 Packaging code into Docker Image version: ${{ env.IMAGE_TAG }}"
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
          # docker tag ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          # docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          echo "✅ Released version ${{ env.IMAGE_TAG }} is now pushed to Docker Hub."

  # STEP 4: CONTINUOUS DEPLOYMENT (Updating the "Non Production" Environment)
  deploy_non_production:
    needs: release # This job only starts after the image is successfully pushed
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Simulated Cloud Trigger
        run: |
          echo "🌐 Connecting to Non Production Cluster..."
          echo "Deploying latest image: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "------------------------------------------------"
          echo "Status: SUCCESS"
          echo "Environment: Staging/Non-Prod"
          echo "Version: ${{ env.IMAGE_TAG }}"
          echo "------------------------------------------------"
          echo "🚀 Deployment Complete! App is live at https://staging-app.example.com"